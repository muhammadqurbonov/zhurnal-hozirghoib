<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Журнали донишгоҳ</title>
<style>
:root{--bg1:#eef2ff;--bg2:#fdf2f8;--card:rgba(255,255,255,.72);--solid:#fff;--text:#161a2b;--muted:#6a7188;--accent:#5b5bf0;--accent2:#8b5cf6;--line:rgba(120,130,170,.22);--ok:#12a36b;--bad:#e5484d;--warn:#e08a1e;--shadow:0 10px 40px -14px rgba(60,60,140,.3)}
@media(prefers-color-scheme:dark){:root{--bg1:#0d1020;--bg2:#1a1030;--card:rgba(28,32,52,.72);--solid:#1b1f33;--text:#eceefb;--muted:#9aa1bd;--accent:#7c83ff;--accent2:#a78bfa;--line:rgba(150,160,210,.2);--ok:#34d399;--bad:#ff6b73;--warn:#fbbf24;--shadow:0 10px 40px -14px rgba(0,0,0,.7)}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.4;z-index:-1;animation:float 18s ease-in-out infinite}
.b1{width:420px;height:420px;background:var(--accent);top:-120px;left:-100px}.b2{width:360px;height:360px;background:var(--accent2);bottom:-100px;right:-80px;animation-delay:-6s}
@keyframes float{50%{transform:translate(40px,30px) scale(1.12)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{opacity:0;transform:translateX(40px)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes flash{from{background:color-mix(in srgb,var(--accent) 28%,transparent)}}
@keyframes grow{from{transform:rotate(-120deg) scale(.5);opacity:0}}
[hidden]{display:none!important}
.lg{min-height:100vh;display:grid;place-items:center;padding:20px}
.lgc{width:100%;max-width:380px;padding:32px;border-radius:24px;background:var(--card);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:var(--shadow);animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both}
.logo{font-size:48px;text-align:center;animation:float 6s ease-in-out infinite}.lgc h1{text-align:center;font-size:1.3rem;margin:4px 0 18px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:20px 14px;background:var(--card);backdrop-filter:blur(18px);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;line-height:1.15;padding:0 8px}.brand i{font-style:normal;font-size:1.8rem}
#nav{display:flex;flex-direction:column;gap:4px;flex:1}
#nav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:600}
#nav button:hover{background:var(--line);color:var(--text);transform:translateX(3px)}
#nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 20px -8px var(--accent)}
.who{display:flex;gap:10px;align-items:center;margin-bottom:10px}.who small{display:block;color:var(--muted)}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.main{padding:26px 30px;min-width:0}.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;gap:10px;flex-wrap:wrap}.top h2{margin:0;font-size:1.6rem}
button,input,select,textarea{font:inherit;color:inherit;background:var(--solid);border:1px solid var(--line);border-radius:10px;padding:9px 12px;transition:all .2s;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
button{cursor:pointer}button:hover{transform:translateY(-1px)}button:active{transform:scale(.96)}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;font-weight:600;box-shadow:0 8px 18px -8px var(--accent)}
.ghost{width:100%;background:none}.ib{padding:5px 8px;background:none;border-color:transparent;font-size:1rem}.ib:hover{background:var(--line)}
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.grid{display:grid;gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:130px}.row.end{justify-content:flex-end}.row.end>*{flex:0}
h3{margin:0 0 6px}.muted{color:var(--muted)}.wrap{overflow-x:auto}.acts{white-space:nowrap}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:.92rem}
th{color:var(--muted);font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
tbody tr{animation:rise .45s both}tbody tr:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}tr.flash{animation:flash 1s}
.tag{padding:2px 10px;border-radius:99px;font-size:.78rem;border:1px solid var(--line);white-space:nowrap;display:inline-block}
.tag.ok{color:var(--ok);border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}.tag.bad{color:var(--bad);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:80px}
.bar span{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}.bar.mid span{background:var(--warn)}.bar.low span{background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}.stat{margin:0}.stat b{font-size:2rem;display:block;line-height:1.15}.stat span{color:var(--muted)}
.banner{padding:16px 18px;border-radius:16px;margin-bottom:16px;font-weight:600;border:1px solid}
.banner.ok{color:var(--ok);border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}.banner.bad{color:var(--bad);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.donut{flex:0!important;width:120px;height:120px;min-width:120px;border-radius:50%;display:grid;place-items:center;position:relative;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.donut::after{content:attr(data-t);position:absolute;inset:16px;border-radius:50%;background:var(--solid);display:grid;place-items:center;font-weight:800;font-size:1.2rem}
.jt th,.jt td{text-align:center;padding:6px 4px;white-space:nowrap}
.jt th:first-child,.jt td:first-child{text-align:left;position:sticky;left:0;background:var(--solid);z-index:1;min-width:170px;padding-left:10px}
.jt th.today{color:var(--accent)}.jt .off{opacity:.45}
.cell{display:flex;gap:4px;align-items:center;justify-content:center}
.st{width:30px;height:30px;padding:0;border-radius:9px;font-weight:700;color:var(--muted)}.st.p{background:var(--ok);color:#fff;border-color:var(--ok)}.st.a{background:var(--bad);color:#fff;border-color:var(--bad)}
.sc{width:50px;padding:5px 2px;text-align:center}.cell :disabled{cursor:not-allowed;opacity:.55;transform:none}
.mnav{display:flex;align-items:center;gap:10px;justify-content:center}.mnav b{min-width:130px;text-align:center}
.days{display:flex;gap:6px;flex-wrap:wrap}.days label{display:flex;gap:5px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;color:var(--text)!important;font-size:.9rem!important}.days input{width:auto;padding:0}
.fld{display:grid;gap:4px}.fld small{color:var(--muted)}
#toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:50}
.toast{padding:12px 16px;border-radius:12px;background:var(--solid);border:1px solid var(--line);border-left:4px solid var(--ok);box-shadow:var(--shadow);animation:slide .35s cubic-bezier(.2,.9,.3,1.2)}.toast.bad{border-left-color:var(--bad)}.toast.out{opacity:0;transform:translateX(30px);transition:.3s}
.back{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,12,30,.45);backdrop-filter:blur(6px);z-index:40;animation:fade .2s}.back.out{opacity:0;transition:.18s}
.modal{width:min(440px,92vw);background:var(--solid);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
.mform{display:grid;gap:12px;margin-top:10px}.mform label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.skel{height:90px;border-radius:18px;margin-bottom:16px;background:linear-gradient(90deg,var(--line) 25%,transparent 50%,var(--line) 75%) 0 0/200% 100%;animation:shimmer 1.2s infinite}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}#nav{flex-direction:row;overflow-x:auto;flex:1 1 100%;order:3}#nav button{white-space:nowrap}.main{padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div id="login" class="lg" hidden></div>
<div id="shell" class="app" hidden>
  <aside class="side">
    <div class="brand"><i>🎓</i><span>Журнали<br>донишгоҳ</span></div>
    <nav id="nav"></nav>
    <div class="user"><div id="who" class="who"></div><button id="out" class="ghost">⎋ Баромадан</button></div>
  </aside>
  <main class="main"><div class="top"><h2 id="title"></h2><span class="muted" id="date"></span></div><section id="view"></section></main>
</div>
<div id="toasts"></div>
<script>
const $=s=>document.querySelector(s);
const h=(tag,props={},...kids)=>{const e=Object.assign(document.createElement(tag),props);kids.flat().forEach(k=>k!=null&&e.append(k instanceof Node?k:document.createTextNode(k)));return e};
const fmt=d=>d?new Date(d).toLocaleDateString('tg-TJ'):'—';
const DAYS=['Яш','Дш','Сш','Чш','Пш','Ҷм','Шб'];
const MONTHS=['Январ','Феврал','Март','Апрел','Май','Июн','Июл','Август','Сентябр','Октябр','Ноябр','Декабр'];
const ROLE={admin:'Администратор',teacher:'Омӯзгор',student:'Донишҷӯ'};
const schedTxt=s=>s?`${s.days.map(d=>DAYS[d]).join(', ')} · ${s.start}–${s.end}`:'—';
let token=sessionStorage.getItem('token'),me=null,types=[],tab=null;
const formData=f=>{const o={};for(const[k,v]of new FormData(f))o[k]=k in o?[].concat(o[k],v):v;return o};
const inp=(name,ph,type='text',value='')=>h('input',{name,placeholder:ph,type,value,required:true,autocomplete:'off'});
const ib=(i,title,fn)=>h('button',{className:'ib',title,onclick:fn},i);
const dayPicker=(sel=[1,3,5])=>h('div',{className:'days'},[1,2,3,4,5,6].map(n=>h('label',{},h('input',{type:'checkbox',name:'days',value:n,checked:sel.includes(n)}),DAYS[n])));

async function api(path,method='GET',body){
  const r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});
  const data=await r.json().catch(()=>({}));
  if(r.status===401&&path!=='/login'){logout(true);throw new Error(data.error||'Сессия тамом шуд')}
  if(!r.ok)throw new Error(data.error||'Хатогӣ');
  return data;
}
function toast(t,err){const n=h('div',{className:'toast'+(err?' bad':'')},(err?'⚠️ ':'✅ ')+t);$('#toasts').append(n);setTimeout(()=>{n.classList.add('out');setTimeout(()=>n.remove(),300)},3400)}
const run=async fn=>{try{await fn()}catch(e){toast(e.message,1)}};
function setView(...nodes){const v=$('#view');v.replaceChildren(...nodes);[...v.children].forEach((c,i)=>{c.style.setProperty('--i',i);c.classList.add('rise')})}
const bar=p=>{const s=h('span');const b=h('div',{className:'bar '+(p==null?'':p<60?'low':p<80?'mid':'')},s);requestAnimationFrame(()=>requestAnimationFrame(()=>s.style.width=(p||0)+'%'));return b};
const num=(n,suf='')=>{const s=h('b',{},'0'+suf);const t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/900);s.textContent=Math.round(n*(1-Math.pow(1-k,3)))+suf;k<1&&requestAnimationFrame(f)};requestAnimationFrame(f);return s};
const GOOD=['ҳозир','фаъол','тасдиқшуда'],BAD=['ғоиб','хориҷшуда','рад шуда'];
const tag=s=>h('span',{className:'tag '+(GOOD.includes(s)?'ok':BAD.includes(s)?'bad':'')},s);
const tbl=(heads,rows,cls='')=>h('div',{className:'card wrap'},rows.length?h('table',{className:cls},h('thead',{},h('tr',{},heads.map(x=>h('th',{},x)))),h('tbody',{},rows)):h('p',{className:'muted'},'Маълумот нест.'));

function ask(title,fields,okText='Тасдиқ'){return new Promise(res=>{
  function close(v){back.classList.add('out');setTimeout(()=>back.remove(),180);res(v)}
  const form=h('form',{className:'mform',onsubmit:e=>{e.preventDefault();close(formData(form))}},
    fields.map(f=>h('label',{},f.label,f.node||h('input',{name:f.name,type:f.type||'text',value:f.value||'',required:true}))),
    h('div',{className:'row end'},h('button',{type:'button',onclick:()=>close(null)},'Бекор'),h('button',{className:'primary'},okText)));
  const back=h('div',{className:'back',onclick:e=>e.target===back&&close(null)},h('div',{className:'modal'},h('h3',{},title),form));
  document.body.append(back);(form.querySelector('input')||form.querySelector('.primary')).focus();
})}
const sure=t=>ask(t,[],'Бале, нест кун').then(v=>v!==null);

// ---------- Воридшавӣ ----------
function loginView(){
  $('#shell').hidden=true;$('#login').hidden=false;
  const f=h('form',{className:'grid'},h('div',{className:'logo'},'🎓'),h('h1',{},'Журнали донишгоҳ'),inp('username','Логин'),inp('password','Парол','password'),h('button',{className:'primary'},'Ворид шудан'));
  f.querySelector('[name=username]').autocomplete='username';f.querySelector('[name=password]').autocomplete='current-password';
  f.onsubmit=e=>{e.preventDefault();run(async()=>{const r=await api('/login','POST',formData(f));token=r.token;sessionStorage.setItem('token',token);await start()})};
  $('#login').replaceChildren(h('div',{className:'lgc'},f));
}
function logout(silent){if(!silent)api('/logout','POST').catch(()=>{});token=null;me=null;sessionStorage.removeItem('token');loginView()}
$('#out').onclick=()=>logout();

const NAV={
  admin:[['dash','📊','Панел',dash],['wd','📝','Дархостҳо',requests],['teachers','👩‍🏫','Омӯзгорон',teachers],['students','🎓','Донишҷуён',students],['journal','📒','Журнал',journal],['results','📈','Натиҷаҳо',results],['me','🔑','Профил',profile]],
  teacher:[['journal','📒','Журнали ман',journal],['results','📈','Натиҷаҳо',results],['students','🎓','Донишҷуён',students],['me','🔑','Профил',profile]],
  student:[['my','🏠','Давомоти ман',myAtt],['wd','📝','Хориҷшавӣ',myWd],['me','🔑','Профил',profile]]};
async function start(){
  const r=await api('/me');me=r.user;types=r.types;
  $('#login').hidden=true;$('#shell').hidden=false;
  $('#who').replaceChildren(h('div',{className:'av'},me.fullName[0]),h('div',{},h('b',{},me.fullName),h('small',{},ROLE[me.role])));
  $('#date').textContent=new Date().toLocaleDateString('tg-TJ',{weekday:'long',day:'numeric',month:'long'});
  tab=NAV[me.role][0][0];show();
}
function show(){
  $('#nav').replaceChildren(...NAV[me.role].map(([k,i,t])=>h('button',{className:tab===k?'on':'',onclick:()=>{tab=k;show()}},i,' ',t)));
  const[,,label,fn]=NAV[me.role].find(x=>x[0]===tab);$('#title').textContent=label;
  setView(h('div',{className:'skel'}),h('div',{className:'skel'}));run(fn);
}

// ---------- Журнал ----------
let jMonth='',jSub='';
async function journal(){
  const subs=await api('/subjects');
  if(!subs.length)return setView(h('div',{className:'card'},'Фан таъин нашудааст.'));
  if(!subs.some(s=>s.id===jSub))jSub=subs[0].id;
  const wrap=h('div'),adm=me.role==='admin';
  const sel=h('select',{onchange:()=>{jSub=sel.value;jMonth='';run(load)}},subs.map(s=>h('option',{value:s.id,selected:s.id===jSub},s.name+` — ${s.teacher}`)));
  const load=async()=>draw(await api(`/journal?month=${jMonth}&subjectId=${jSub}`));
  function draw(d){
    jMonth=d.month;const[y,mo]=d.month.split('-').map(Number),sch=d.subject.schedule,rows={};
    const shift=n=>{const x=new Date(y,mo-1+n,1);jMonth=`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`;run(load)};
    const can=ds=>d.editable&&ds<=d.today&&!(ds===d.today&&d.now<sch.start);
    const rec=(id,ds)=>((d.marks[id]??={})[ds]??={status:null,score:null});
    const redraw=(st,f)=>{const n=rowEl(st);if(f)n.classList.add('flash');rows[st.id].replaceWith(n);rows[st.id]=n};
    async function save(st,ds,patch){const r=rec(st.id,ds),old={...r};Object.assign(r,patch);redraw(st,1);
      try{await api('/journal/mark','POST',{date:ds,entries:[{studentId:st.id,...patch}]})}catch(e){Object.assign(r,old);redraw(st);toast(e.message,1)}}
    function rowEl(st){let p=0,a=0,sum=0,c=0;
      const tds=d.dates.map(ds=>{const r=rec(st.id,ds),ok=can(ds);
        if(r.status==='ҳозир')p++;if(r.status==='ғоиб')a++;if(r.score!=null){sum+=r.score;c++}
        return h('td',{className:ds>d.today?'off':''},h('div',{className:'cell'},
          h('button',{className:'st '+(r.status==='ҳозир'?'p':r.status==='ғоиб'?'a':''),disabled:!ok,title:r.status||'Гузошта нашудааст',onclick:()=>save(st,ds,{status:r.status===null?'ҳозир':r.status==='ҳозир'?'ғоиб':null})},r.status==='ҳозир'?'✓':r.status==='ғоиб'?'✗':'·'),
          h('input',{className:'sc',type:'number',min:0,max:100,step:1,placeholder:'бал',value:r.score??'',disabled:!ok,onchange:e=>save(st,ds,{score:e.target.value===''?null:Number(e.target.value)})})))});
      const pc=p+a?Math.round(p/(p+a)*100):null;
      return h('tr',{},h('td',{},h('b',{},st.fullName),h('div',{className:'muted'},st.group)),tds,h('td',{},pc==null?'—':pc+'%'),h('td',{},c?Math.round(sum/c):'—'));
    }
    async function markAll(ds){const ents=d.students.filter(s=>rec(s.id,ds).status===null).map(s=>({studentId:s.id,status:'ҳозир'}));
      if(!ents.length)return toast('Ҳама аллакай гузошта шудаанд');
      try{await api('/journal/mark','POST',{date:ds,entries:ents});ents.forEach(e=>rec(e.studentId,ds).status='ҳозир');d.students.forEach(s=>redraw(s,1));toast('Ҳама ҳозир гузошта шуданд')}catch(e){toast(e.message,1)}}
    const head=h('tr',{},h('th',{},'Донишҷӯ'),d.dates.map(ds=>{const dt=new Date(ds+'T00:00:00');
      return h('th',{className:(ds===d.today?'today ':'')+(ds>d.today?'off':'')},h('div',{},dt.getDate()+' '+DAYS[dt.getDay()]),can(ds)?ib('✓✓','Ҳамаро ҳозир кун',()=>markAll(ds)):'')}),h('th',{},'Давомот'),h('th',{},'Бали миёна'));
    const tb=h('tbody',{},d.students.map(st=>(rows[st.id]=rowEl(st))));
    const csv=()=>{const q=v=>`"${String(v).replace(/"/g,'""')}"`,L=[['Донишҷӯ','Гурӯҳ',...d.dates].map(q).join(',')];
      d.students.forEach(s=>L.push([s.fullName,s.group,...d.dates.map(ds=>{const r=rec(s.id,ds);return `${r.status||''} ${r.score??''}`.trim()})].map(q).join(',')));
      h('a',{href:URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv;charset=utf-8'})),download:`journal-${d.month}.csv`}).click()};
    wrap.replaceChildren(
      h('div',{className:'card'},h('div',{className:'row'},adm?sel:h('h3',{},'📒 '+d.subject.name),h('span',{className:'tag'},'🗓 '+schedTxt(sch)),
        h('div',{className:'mnav'},h('button',{onclick:()=>shift(-1)},'‹'),h('b',{},`${MONTHS[mo-1]} ${y}`),h('button',{onclick:()=>shift(1)},'›')),h('button',{onclick:csv},'⬇ CSV'))),
      h('div',{className:'card wrap'},d.dates.length&&d.students.length?h('table',{className:'jt'},h('thead',{},head),tb):h('p',{className:'muted'},'Дар ин моҳ дарс ё донишҷӯи фаъол нест.')),
      d.editable?h('p',{className:'muted'},'💡 Тугмаро пахш кунед: · → ✓ (ҳозир) → ✗ (ғоиб) → ·. Бал (0–100) дар майдони дуюм. Рӯзҳои гузаштаро ҳамеша пур кардан мумкин аст; рӯзи ҷорӣ — аз оғози дарс.'):'');
  }
  wrap.append(h('div',{className:'skel'}));setView(wrap);await load();
}

// ---------- Натиҷаҳо ----------
async function results(){
  const subs=await api('/subjects');
  if(!subs.length)return setView(h('div',{className:'card'},'Фан нест.'));
  const sel=h('select',{onchange:()=>run(load)},subs.map(s=>h('option',{value:s.id},s.name+(me.role==='admin'?` — ${s.teacher}`:''))));
  const box=h('div');
  async function load(){const d=await api('/attendance/summary?subjectId='+sel.value);
    const a=d.rows.filter(r=>r.percent!==null),mean=a.length?Math.round(a.reduce((x,r)=>x+r.percent,0)/a.length):0;
    box.replaceChildren(h('div',{className:'stats'},...[['Дарсҳо',d.dates,''],['Донишҷуён',d.rows.length,''],['Давомоти миёна',mean,'%']].map(([k,v,u])=>h('div',{className:'card stat'},num(v,u),h('span',{},k)))),
      tbl(['Донишҷӯ','Гурӯҳ','Ҳозир','Ғоиб','Давомот','Бали миёна','Ҳолат'],[...d.rows].sort((x,y)=>(x.percent??101)-(y.percent??101)).map(r=>h('tr',{},h('td',{},r.fullName),h('td',{},r.group),h('td',{},r.present),h('td',{},r.absent),h('td',{},(r.percent==null?'—':r.percent+'%'),bar(r.percent)),h('td',{},r.avg??'—'),h('td',{},tag(r.status))))))}
  setView(h('div',{className:'card'},h('div',{className:'row'},h('label',{},'Фан:'),sel)),box);await load();
}

// ---------- Донишҷуён ----------
async function students(){
  const list=await api('/students'),adm=me.role==='admin';
  const f=h('form',{className:'grid'},h('h3',{},'➕ Донишҷӯи нав'),h('div',{className:'row'},inp('fullName','Ному насаб'),inp('group','Гурӯҳ'),inp('course','Курс','number')),
    h('div',{className:'row'},inp('username','Логин (лотинӣ)'),inp('password','Парол (камаш 6)'),h('button',{className:'primary'},'Илова кардан')));
  f.onsubmit=e=>{e.preventDefault();run(async()=>{await api('/students','POST',formData(f));toast('Донишҷӯ илова шуд');students()})};
  const holder=h('div'),q=h('input',{placeholder:'🔍 Ҷустуҷӯ аз рӯи ном, логин ё гурӯҳ...',oninput:()=>fill()});
  function fill(){const t=q.value.toLowerCase();
    holder.replaceChildren(tbl(['Ному насаб','Логин','Гурӯҳ','Курс','Ҳолат','Санаи хориҷшавӣ',''],list.filter(s=>[s.fullName,s.username,s.group].join(' ').toLowerCase().includes(t)).map(s=>
      h('tr',{},h('td',{},s.fullName),h('td',{},s.username),h('td',{},s.group),h('td',{},s.course),h('td',{},tag(s.status)),h('td',{},fmt(s.exitDate)),
        h('td',{className:'acts'},adm?[ib('🔑','Тағйири парол',()=>resetPw(s.userId,s.fullName)),ib('🗑','Нест кардан',()=>delStudent(s))]:'')))))}
  fill();setView(h('div',{className:'card'},f),h('div',{className:'card'},q),holder);
}
async function resetPw(id,name){const v=await ask('Пароли нав барои '+name,[{label:'Пароли нав (камаш 6 аломат)',name:'password'}],'Захира');
  if(v)run(async()=>{await api(`/users/${id}/password`,'POST',v);toast('Парол иваз шуд')})}
async function delStudent(s){if(await sure(`«${s.fullName}» бо тамоми давомот, баҳо ва дархостҳояш нест карда мешавад. Давом медиҳед?`))run(async()=>{await api('/students/'+s.id,'DELETE');toast('Донишҷӯ нест карда шуд');students()})}

// ---------- Омӯзгорон (админ) ----------
async function teachers(){
  const list=await api('/teachers'),dp=dayPicker();
  const f=h('form',{className:'grid'},h('h3',{},'➕ Омӯзгори нав'),
    h('div',{className:'row'},inp('fullName','Ному насаб'),inp('subjectName','Номи фан')),
    h('div',{className:'row'},inp('username','Логин (лотинӣ)'),inp('password','Парол (камаш 6)')),
    h('div',{className:'row'},h('div',{className:'fld'},h('small',{},'Рӯзҳои дарс'),dp),h('div',{className:'fld'},h('small',{},'Оғоз'),inp('start','','time','08:30')),h('div',{className:'fld'},h('small',{},'Анҷом'),inp('end','','time','10:00')),h('button',{className:'primary'},'Илова кардан')));
  f.onsubmit=e=>{e.preventDefault();run(async()=>{await api('/teachers','POST',formData(f));toast('Омӯзгор илова шуд');teachers()})};
  setView(h('div',{className:'card'},f),tbl(['Ному насаб','Логин','Фан','Ҷадвал',''],list.map(t=>h('tr',{},h('td',{},t.fullName),h('td',{},t.username),h('td',{},t.subject),h('td',{},schedTxt(t.schedule)),
    h('td',{className:'acts'},ib('🗓','Ҷадвал',()=>editSched(t)),ib('🔑','Тағйири парол',()=>resetPw(t.id,t.fullName)),ib('🗑','Нест кардан',()=>delTeacher(t)))))));
}
async function editSched(t){const v=await ask('Ҷадвали «'+t.subject+'»',[{label:'Рӯзҳо',node:dayPicker(t.schedule.days)},{label:'Оғоз',name:'start',type:'time',value:t.schedule.start},{label:'Анҷом',name:'end',type:'time',value:t.schedule.end}],'Захира');
  if(v)run(async()=>{await api('/subjects/'+t.subjectId,'PATCH',v);toast('Ҷадвал навсозӣ шуд');teachers()})}
async function delTeacher(t){if(await sure(`«${t.fullName}», фанни «${t.subject}» ва тамоми давомоти ин фан нест карда мешавад. Давом медиҳед?`))run(async()=>{await api('/teachers/'+t.id,'DELETE');toast('Омӯзгор нест карда шуд');teachers()})}

// ---------- Админ: панел ва дархостҳо ----------
async function dash(){
  const s=await api('/stats'),act=s.students['фаъол']||0,out=s.students['хориҷшуда']||0,pend=s.withdrawals['интизорӣ']||0,tot=act+out,p=tot?Math.round(act/tot*100):0;
  const donut=h('div',{className:'donut',style:`background:conic-gradient(var(--ok) 0 ${p}%,var(--bad) 0)`});donut.setAttribute('data-t',p+'%');
  const bt=Object.entries(s.byType);
  setView(h('div',{className:'stats'},...[['Донишҷӯёни фаъол',act],['Хориҷшудагон',out],['Омӯзгорон',s.teachers['Шумора']],['Дархостҳои интизор',pend]].map(([k,v])=>h('div',{className:'card stat'},num(v),h('span',{},k)))),
    h('div',{className:'card'},h('div',{className:'row'},donut,h('div',{},h('h3',{},'Таркиби донишҷуён'),h('p',{className:'muted'},`Фаъол: ${act} · Хориҷшуда: ${out}`)))),
    h('div',{className:'card'},h('h3',{},'Сабабҳои хориҷшавӣ'),bt.length?bt.map(([k,v])=>h('div',{style:'margin:10px 0'},`${k} — ${v}`,bar(Math.round(v/out*100)))):h('p',{className:'muted'},'Ҳоло хориҷшавӣ нест.')));
}
async function requests(){
  const list=await api('/withdrawals');
  setView(tbl(['Донишҷӯ','Гурӯҳ','Намуд','Сабаб','Сана','Ҳолат',''],list.map(w=>h('tr',{},h('td',{},w.student?.fullName),h('td',{},w.student?.group),h('td',{},w.type),h('td',{},w.reason),h('td',{},fmt(w.createdAt)),
    h('td',{},tag(w.status),w.comment?h('div',{className:'muted'},w.comment):''),
    h('td',{className:'acts'},w.status==='интизорӣ'?[ib('✔','Тасдиқ',()=>decide(w.id,'тасдиқшуда')),ib('✖','Рад',()=>decide(w.id,'рад шуда'))]:'')))));
}
async function decide(id,status){const v=await ask(status==='тасдиқшуда'?'Тасдиқи хориҷшавӣ':'Рад кардани дархост',[{label:'Шарҳ (ихтиёрӣ)',node:h('input',{name:'comment'})}]);
  if(v)run(async()=>{await api('/withdrawals/'+id,'PATCH',{status,comment:v.comment});toast('Қарор сабт шуд');requests()})}

// ---------- Донишҷӯ ----------
async function myAtt(){
  const d=await api('/my/attendance'),out=d.student.status==='хориҷшуда';
  const sc=d.subjects.filter(s=>s.avg!=null),avg=sc.length?Math.round(sc.reduce((a,s)=>a+s.avg,0)/sc.length):0;
  const tot=d.subjects.reduce((a,s)=>a+s.total,0),pr=d.subjects.reduce((a,s)=>a+s.present,0);
  setView(h('div',{className:'banner '+(out?'bad':'ok')},out?`🚫 Ҳолат: хориҷшуда (аз ${fmt(d.student.exitDate)})`:'✅ Ҳолат: фаъол — шумо донишҷӯи ҳозираи донишгоҳ ҳастед'),
    h('div',{className:'stats'},h('div',{className:'card stat'},num(tot?Math.round(pr/tot*100):0,'%'),h('span',{},'Давомоти умумӣ')),h('div',{className:'card stat'},num(avg),h('span',{},'Бали миёна')),
      h('div',{className:'card stat'},h('b',{},d.student.group),h('span',{},'Гурӯҳ')),h('div',{className:'card stat'},h('b',{},d.student.course),h('span',{},'Курс'))),
    ...d.subjects.map(s=>h('div',{className:'card'},h('div',{className:'row'},h('h3',{},s.name),h('span',{className:'muted'},'👩‍🏫 '+(s.teacher||'—')),h('span',{className:'tag'},'🗓 '+schedTxt(s.schedule)),h('b',{},s.percent==null?'—':s.percent+'%')),
      bar(s.percent),h('p',{className:'muted'},`Ҳозир: ${s.present} · Ғоиб: ${s.absent} · Бали миёна: ${s.avg??'—'}`),
      h('div',{className:'chips'},s.recent.map(r=>h('span',{className:'tag '+(r.status==='ҳозир'?'ok':r.status==='ғоиб'?'bad':'')},`${fmt(r.date)} · ${r.status||'—'}${r.score!=null?' · '+r.score+' бал':''}`))))));
}
async function myWd(){
  const[list,att]=await Promise.all([api('/withdrawals'),api('/my/attendance')]);
  const out=att.student.status==='хориҷшуда',open=list.some(w=>w.status==='интизорӣ');
  const f=h('form',{className:'grid'},h('h3',{},'Дархости хориҷшавӣ'),h('select',{name:'type'},types.map(t=>h('option',{},t))),h('textarea',{name:'reason',rows:3,placeholder:'Сабаб...',required:true}),h('button',{className:'primary'},'Ирсол кардан'));
  f.onsubmit=e=>{e.preventDefault();run(async()=>{await api('/withdrawals','POST',formData(f));toast('Дархост ирсол шуд');myWd()})};
  setView(h('div',{className:'card'},out?'Шумо хориҷ шудаед.':open?'⏳ Дархости шумо дар интизори баррасӣ аст.':f),
    tbl(['Намуд','Сабаб','Сана','Ҳолат','Шарҳ'],list.map(w=>h('tr',{},h('td',{},w.type),h('td',{},w.reason),h('td',{},fmt(w.createdAt)),h('td',{},tag(w.status)),h('td',{},w.comment)))));
}

// ---------- Профил ----------
function profile(){
  const f=h('form',{className:'grid'},h('h3',{},'Тағйири парол'),inp('oldPassword','Пароли ҳозира','password'),inp('newPassword','Пароли нав (камаш 6)','password'),h('button',{className:'primary'},'Захира кардан'));
  f.onsubmit=e=>{e.preventDefault();run(async()=>{await api('/me/password','POST',formData(f));f.reset();toast('Парол иваз шуд')})};
  setView(h('div',{className:'card'},h('div',{className:'who'},h('div',{className:'av'},me.fullName[0]),h('div',{},h('b',{},me.fullName),h('small',{},`Логин: ${me.username} · ${ROLE[me.role]}`)))),h('div',{className:'card'},f));
}

if(token)start().catch(()=>loginView());else loginView();
